services:
  - type: web
    name: bright-ledger-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_URL
        sync: false
      - key: API_ORIGIN
        sync: false
      - key: AUTH_URI
        sync: false
      - key: AUTH_DOMAIN
        sync: false
      - key: SEED_SAMPLE_DATA
        value: "false"
      - key: DATABASE_SSL
        value: "true"
      - key: EIA_API_KEY
        sync: false
