version: "1"

services:
  - type: web
    name: bright-ledger-api
    runtime: docker
    plan: free
    region: oregon
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: API_ORIGIN
        sync: false
      - key: AUTH_URI
        sync: false
      - key: AUTH_DOMAIN
        value: Bright Ledger
      - key: CHAIN_RPC_URL
        sync: false
      - key: CONTRACT_ADDRESS
        sync: false
      - key: BOA_CONTRACT_ADDRESS
        sync: false
      - key: CHAIN_ID
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3.5-super-vl:free
      - key: EIA_API_KEY
        sync: false
